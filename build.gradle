    return requestedTaskNames.any { taskName ->
        taskName == 'dualNodeMultiTenantIntegTest'
            || taskName.endsWith(':dualNodeMultiTenantIntegTest')
            || taskName == 'threeRoleMultiTenantIntegTest'
            || taskName.endsWith(':threeRoleMultiTenantIntegTest')
    }
}

