def readAwsProfileSettings(String profileName = multiTenantAwsProfileName()) {
    if (project.ext.multiTenantAwsProfileSettingsCache == null) {
        project.ext.multiTenantAwsProfileSettingsCache = [:]
    }
    if (project.ext.multiTenantAwsProfileSettingsCache.containsKey(profileName)) {
        return project.ext.multiTenantAwsProfileSettingsCache[profileName]
    }

    File configFile = file(System.getenv('AWS_CONFIG_FILE') ?: "${System.getProperty('user.home')}/.aws/config")
    File credentialsFile = file(System.getenv('AWS_SHARED_CREDENTIALS_FILE') ?: "${System.getProperty('user.home')}/.aws/credentials")
    Map<String, String> profileSettings = [:]
    profileSettings.putAll(readAwsProfileFile(configFile, profileName, true))
    profileSettings.putAll(readAwsProfileFile(credentialsFile, profileName, false))

    project.ext.multiTenantAwsProfileSettingsCache[profileName] = profileSettings
    return project.ext.multiTenantAwsProfileSettingsCache[profileName]
}

def readDefaultAwsProfileSettings() {
    return readAwsProfileSettings('default')
}

def readAwsProfileFile(File profileFile, String profileName, boolean configFile) {
    if (!profileFile.exists()) {
        return [:]
    }
    def profileSettings = [:]
    boolean inRequestedProfile = false
    profileFile.eachLine(StandardCharsets.UTF_8.name()) { rawLine ->
        String line = rawLine.trim()
        if (line.isEmpty() || line.startsWith('#') || line.startsWith(';')) {
            return
        }

        if (line.startsWith('[') && line.endsWith(']')) {
            String section = line.substring(1, line.length() - 1).trim()
            inRequestedProfile = awsProfileSectionMatches(section, profileName, configFile)
            return
        }

        if (!inRequestedProfile) {
            return
        }

        int separatorIndex = line.indexOf('=')
        if (separatorIndex <= 0) {
            return
        }

        String key = line.substring(0, separatorIndex).trim()
        String value = line.substring(separatorIndex + 1).trim()
        profileSettings[key] = value
    }
    return profileSettings
}

def awsProfileSectionMatches(String section, String profileName, boolean configFile) {
    if (profileName == 'default') {
        return section == 'default' || section == 'profile default'
    }
    return section == profileName || (configFile && section == "profile ${profileName}")
}

def hasAwsProfileConfigured(String profileName = multiTenantAwsProfileName()) {
    File configFile = file(System.getenv('AWS_CONFIG_FILE') ?: "${System.getProperty('user.home')}/.aws/config")
    File credentialsFile = file(System.getenv('AWS_SHARED_CREDENTIALS_FILE') ?: "${System.getProperty('user.home')}/.aws/credentials")
    return hasAwsProfileSection(configFile, profileName, true) || hasAwsProfileSection(credentialsFile, profileName, false)
}

def hasDefaultAwsProfileConfigured() {
    return hasAwsProfileConfigured('default')
}

def hasAwsProfileSection(File profileFile, String profileName, boolean configFile) {
    if (!profileFile.exists()) {
        return false
    }
    boolean found = false
    profileFile.eachLine(StandardCharsets.UTF_8.name()) { rawLine ->
        String line = rawLine.trim()
        if (line.startsWith('[') && line.endsWith(']')) {
            String section = line.substring(1, line.length() - 1).trim()
            if (awsProfileSectionMatches(section, profileName, configFile)) {
                found = true
            }
        }
    }
    return found
}

def multiTenantAwsCredentialRefreshSkew() {
    return java.time.Duration.ofMinutes(5)
}

def multiTenantAwsCredentialExpiration(Map<String, String> awsCredentials) {
    if (!hasNonBlankValue(awsCredentials.expiration)) {
        return null
    }
    try {
        return java.time.Instant.parse(awsCredentials.expiration)
    } catch (Exception e) {
        logger.warn("Ignoring unparsable AWS credential expiration [{}].", awsCredentials.expiration)
        return null
    }
}

def cachedMultiTenantAwsCredentials(boolean allowNearExpiration = false) {
    Map<String, String> awsCredentials = project.ext.multiTenantAwsCredentialsCache as Map<String, String>
    if (awsCredentials == null || awsCredentials.isEmpty()) {
        return [:]
    }

    def expiration = multiTenantAwsCredentialExpiration(awsCredentials)
    if (expiration == null) {
        return awsCredentials
    }

    def threshold = allowNearExpiration ? java.time.Instant.now() : java.time.Instant.now().plus(multiTenantAwsCredentialRefreshSkew())
    return expiration.isAfter(threshold) ? awsCredentials : [:]
}

def cacheMultiTenantAwsCredentials(Map<String, String> awsCredentials) {
    if (awsCredentials != null && !awsCredentials.isEmpty()) {
        project.ext.multiTenantAwsCredentialsCache = new LinkedHashMap<String, String>(awsCredentials)
    }
    return awsCredentials
}

def resolveMultiTenantAwsCredentials() {
    def accessKeyId = System.getenv('AWS_ACCESS_KEY_ID')
    def secretAccessKey = System.getenv('AWS_SECRET_ACCESS_KEY')
    def sessionToken = System.getenv('AWS_SESSION_TOKEN')
    if (
        !hasExplicitMultiTenantAwsProfile()
            && accessKeyId != null
            && !accessKeyId.isBlank()
            && secretAccessKey != null
            && !secretAccessKey.isBlank()
    ) {
        return cacheMultiTenantAwsCredentials([
            accessKeyId    : accessKeyId,
            secretAccessKey: secretAccessKey,
            sessionToken   : sessionToken ?: "",
            expiration     : ""
        ])
    }

    if (!shouldRunMultiTenantAwsTask()) {
        return [:]
    }

    def profileName = multiTenantAwsProfileName()
    def profileSettings = readAwsProfileSettings(profileName)
    def credentialProcess = profileSettings['credential_process']
    if (credentialProcess == null || credentialProcess.isBlank()) {
        def profileAccessKeyId = profileSettings['aws_access_key_id']
        def profileSecretAccessKey = profileSettings['aws_secret_access_key']
        if (
            profileAccessKeyId != null
                && !profileAccessKeyId.toString().isBlank()
                && profileSecretAccessKey != null
                && !profileSecretAccessKey.toString().isBlank()
        ) {
            return cacheMultiTenantAwsCredentials([
                accessKeyId    : profileAccessKeyId.toString(),
                secretAccessKey: profileSecretAccessKey.toString(),
                sessionToken   : (profileSettings['aws_session_token'] ?: "").toString(),
                expiration     : (profileSettings['expiration'] ?: "").toString()
            ])
        }

        if (hasAwsProfileConfigured(profileName)) {
            return [:]
        } else {
            throw new GradleException(
                "Missing AWS credentials for AWS-backed multi-tenant integration tests. "
                    + "Export AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY or configure the AWS profile [${profileName}]."
            )
        }
    }

    def process = new ProcessBuilder('/bin/zsh', '-lc', credentialProcess).redirectErrorStream(true).start()
    def output = process.inputStream.getText(StandardCharsets.UTF_8.name())
    if (!process.waitFor(60, TimeUnit.SECONDS)) {
        process.destroyForcibly()
        throw new GradleException("Timed out while resolving AWS credentials from the AWS profile [${profileName}] credential_process.")
    }
    if (process.exitValue() != 0) {
        throw new GradleException(
            "Failed to resolve AWS credentials from the AWS profile [${profileName}] credential_process. Output: ${output.trim()}"
        )
    }

    def parsed = new JsonSlurper().parseText(output)
    accessKeyId = parsed.AccessKeyId ?: parsed.accessKeyId
    secretAccessKey = parsed.SecretAccessKey ?: parsed.secretAccessKey
    sessionToken = parsed.SessionToken ?: parsed.sessionToken ?: ""
    def expiration = parsed.Expiration ?: parsed.expiration ?: ""
    if (accessKeyId == null || accessKeyId.toString().isBlank() || secretAccessKey == null || secretAccessKey.toString().isBlank()) {
        throw new GradleException("AWS profile [${profileName}] credential_process did not return AccessKeyId/SecretAccessKey.")
    }

    return cacheMultiTenantAwsCredentials([
        accessKeyId    : accessKeyId.toString(),
        secretAccessKey: secretAccessKey.toString(),
        sessionToken   : sessionToken.toString(),
        expiration     : expiration.toString()
    ])
}

def shouldUseMultiTenantAwsCredentialsEndpoint() {
    return shouldRunMultiTenantAwsTask()
}

def resolveMultiTenantAwsCredentialsForEndpoint() {
    Map<String, String> cachedCredentials = cachedMultiTenantAwsCredentials(false)
    if (!cachedCredentials.isEmpty()) {
        return cachedCredentials
    }

    try {
        return resolveMultiTenantAwsCredentials()
    } catch (Exception e) {
        cachedCredentials = cachedMultiTenantAwsCredentials(true)
        if (!cachedCredentials.isEmpty()) {
            logger.warn("Failed to refresh AWS credentials for the local multi-tenant test cluster; serving cached credentials until expiration.")
            return cachedCredentials
        }
        throw e
    }
}

def multiTenantAwsCredentialsEndpointResponse(Map<String, String> awsCredentials) {
    def expiration = hasNonBlankValue(awsCredentials.expiration)
        ? awsCredentials.expiration
        : java.time.Instant.now().plus(java.time.Duration.ofHours(1)).toString()
    def response = [
        AccessKeyId    : awsCredentials.accessKeyId,
        SecretAccessKey: awsCredentials.secretAccessKey,
        Expiration     : expiration
    ]
    if (hasNonBlankValue(awsCredentials.sessionToken)) {
        response.Token = awsCredentials.sessionToken
    }
    return groovy.json.JsonOutput.toJson(response)
}

def multiTenantAwsCredentialsErrorResponse() {
    return groovy.json.JsonOutput.toJson([Code: 'CredentialsUnavailable', Message: 'AWS credentials are unavailable'])
}

def multiTenantAwsCredentialsServerUri() {
    if (!shouldUseMultiTenantAwsCredentialsEndpoint()) {
        return ""
    }
    if (hasNonBlankValue(project.ext.multiTenantAwsCredentialsServerUri as String)) {
        return project.ext.multiTenantAwsCredentialsServerUri
    }

    def server = com.sun.net.httpserver.HttpServer.create(
        new java.net.InetSocketAddress(java.net.InetAddress.getByName('127.0.0.1'), 0),
        0
    )
    def executor = java.util.concurrent.Executors.newSingleThreadExecutor({ Runnable runnable ->
        Thread thread = new Thread(runnable, 'multi-tenant-aws-credentials-endpoint')
        thread.daemon = true
        return thread
    } as java.util.concurrent.ThreadFactory)
    server.executor = executor
    server.createContext('/credentials') { exchange ->
        int statusCode = 200
        byte[] responseBytes
        try {
            if (exchange.requestMethod != 'GET') {
                statusCode = 405
                responseBytes = multiTenantAwsCredentialsErrorResponse().getBytes(StandardCharsets.UTF_8)
            } else {
                Map<String, String> awsCredentials = resolveMultiTenantAwsCredentialsForEndpoint()
                if (awsCredentials.isEmpty()) {
                    statusCode = 404
                    responseBytes = multiTenantAwsCredentialsErrorResponse().getBytes(StandardCharsets.UTF_8)
                } else {
                    responseBytes = multiTenantAwsCredentialsEndpointResponse(awsCredentials).getBytes(StandardCharsets.UTF_8)
                }
            }
        } catch (Exception e) {
            statusCode = 500
            logger.warn('Failed to resolve AWS credentials for the local multi-tenant test cluster.')
            responseBytes = multiTenantAwsCredentialsErrorResponse().getBytes(StandardCharsets.UTF_8)
        }

        exchange.responseHeaders.set('Content-Type', 'application/json')
        exchange.sendResponseHeaders(statusCode, responseBytes.length)
        exchange.responseBody.write(responseBytes)
        exchange.close()
    }
    server.start()

    project.ext.multiTenantAwsCredentialsServer = server
    project.ext.multiTenantAwsCredentialsServerExecutor = executor
    project.ext.multiTenantAwsCredentialsServerUri = "http://127.0.0.1:${server.address.port}/credentials"
    return project.ext.multiTenantAwsCredentialsServerUri
}

def stopMultiTenantAwsCredentialsServer() {
    def server = project.ext.multiTenantAwsCredentialsServer
    if (server != null) {
        server.stop(0)
        project.ext.multiTenantAwsCredentialsServer = null
    }
    def executor = project.ext.multiTenantAwsCredentialsServerExecutor
    if (executor != null) {
        executor.shutdownNow()
        project.ext.multiTenantAwsCredentialsServerExecutor = null
    }
    project.ext.multiTenantAwsCredentialsServerUri = null
}

def resolveMultiTenantAwsCredentialsForLocalJvm() {
    return shouldUseGeneratedMultiTenantAwsProfile()
        ? resolveMultiTenantAwsCredentials()
        : (hasExplicitMultiTenantAwsProfile() ? [:] : resolveMultiTenantAwsCredentials())
}

