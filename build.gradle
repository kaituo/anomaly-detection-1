def resolveMultiTenantSetting(String propertyName, String envName, String defaultValue = null) {
    if (propertyName != null && !propertyName.isBlank()) {
        def projectValue = project.findProperty(propertyName)?.toString()
        if (projectValue != null && !projectValue.isBlank()) {
            return projectValue
        }

        def systemValue = System.getProperty(propertyName)
        if (systemValue != null && !systemValue.isBlank()) {
            return systemValue
        }
    }

    if (envName != null && !envName.isBlank()) {
        def envValue = System.getenv(envName)
        if (envValue != null && !envValue.isBlank()) {
            return envValue
        }
    }

    return defaultValue
}

def resolveOpenSearchTestSetting(String settingKey, String propertyName = null, String envName = null, String defaultValue = null) {
    def testPropertyValue = System.getProperty("tests.opensearch.${settingKey}")
    if (testPropertyValue != null && !testPropertyValue.isBlank()) {
        return testPropertyValue
    }

    return resolveMultiTenantSetting(propertyName, envName, defaultValue)
}

