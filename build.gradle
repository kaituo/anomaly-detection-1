def generatedMultiTenantAwsProfileFiles() {
    if (!shouldUseGeneratedMultiTenantAwsProfile()) {
        return [:]
    }
    return [
        configFile     : generatedMultiTenantAwsConfigFile().absolutePath,
        credentialsFile: generatedMultiTenantAwsCredentialsFile().absolutePath
    ]
}

def writeGeneratedMultiTenantAwsProfile(Map<String, String> awsCredentials) {
    def profileName = multiTenantAwsProfileName()
    def profileDir = generatedMultiTenantAwsProfileDir()
    profileDir.mkdirs()

    generatedMultiTenantAwsConfigFile().setText(
        "[profile ${profileName}]\nregion = ${resolveMultiTenantAwsRegion()}\n",
        StandardCharsets.UTF_8.name()
    )

    def credentialsBody = new StringBuilder()
    credentialsBody.append("[${profileName}]\n")
    credentialsBody.append("aws_access_key_id = ${awsCredentials.accessKeyId}\n")
    credentialsBody.append("aws_secret_access_key = ${awsCredentials.secretAccessKey}\n")
    if (hasNonBlankValue(awsCredentials.sessionToken)) {
        credentialsBody.append("aws_session_token = ${awsCredentials.sessionToken}\n")
    }
    generatedMultiTenantAwsCredentialsFile().setText(credentialsBody.toString(), StandardCharsets.UTF_8.name())
}

def refreshGeneratedMultiTenantAwsProfile() {
    if (!shouldUseGeneratedMultiTenantAwsProfile()) {
        return [:]
    }

    Map<String, String> awsCredentials = resolveMultiTenantAwsCredentials()
    writeGeneratedMultiTenantAwsProfile(awsCredentials)
    return generatedMultiTenantAwsProfileFiles()
}

def startGeneratedMultiTenantAwsProfileRefresh() {
    if (!shouldUseGeneratedMultiTenantAwsProfile()) {
        return [:]
    }

    def generatedProfile = refreshGeneratedMultiTenantAwsProfile()
    def refreshIntervalSeconds = Math
        .max(1L, (System.getProperty('aws.profile.refresh_interval_seconds') ?: '300').toLong())

    Thread currentThread = project.ext.multiTenantAwsProfileRefreshThread as Thread
    if (currentThread == null || !currentThread.isAlive()) {
        Thread refreshThread = new Thread({
            while (!Thread.currentThread().isInterrupted()) {
                try {
                    Thread.sleep(TimeUnit.SECONDS.toMillis(refreshIntervalSeconds))
                    refreshGeneratedMultiTenantAwsProfile()
                    logger.lifecycle("Refreshed generated AWS credentials for profile [${multiTenantAwsProfileName()}].")
                } catch (InterruptedException e) {
                    Thread.currentThread().interrupt()
                } catch (Exception e) {
                    logger.warn("Failed to refresh generated AWS credentials for profile [${multiTenantAwsProfileName()}].", e)
                }
            }
        } as Runnable, "multi-tenant-aws-profile-refresh")
        refreshThread.daemon = true
        refreshThread.start()
        project.ext.multiTenantAwsProfileRefreshThread = refreshThread
    }

    return generatedProfile
}

def stopGeneratedMultiTenantAwsProfileRefresh() {
    Thread refreshThread = project.ext.multiTenantAwsProfileRefreshThread as Thread
    if (refreshThread != null) {
        refreshThread.interrupt()
        project.ext.multiTenantAwsProfileRefreshThread = null
    }
}

