// ====== Inputs you can override with -P ======
def osVersion      = opensearch_distribution_version
def httpPort       = (findProperty('httpPort') ?: '9201').toString()
def transportPort  = (findProperty('transportPort') ?: '9301').toString()

// Always use the Linux "min" distro; choose arch by host JVM arch
def hostArch   = System.getProperty('os.arch').toLowerCase()
def linuxArch  = (hostArch.contains('aarch64') || hostArch.contains('arm64')) ? 'arm64' : 'x64'
def osPlatform = "linux-${linuxArch}"  // always Linux

// Extra OpenSearch node settings (-E k=v,k=v) and JVM args for the process
def extraSettings  = (findProperty('extraSettings') ?: '').toString()
def osJavaOpts     = (findProperty('osJavaOpts') ?: '').toString()

def parseRunAtPortsSettings = { String raw ->
    def settings = new LinkedHashMap<String, String>()
    if (!raw) {
        return settings
    }

    raw.split(/\s*,\s*/).findAll { it }.each { kv ->
        def parts = kv.split(/\s*=\s*/, 2)
        if (parts.size() != 2 || parts[0].trim().isEmpty()) {
            throw new GradleException("Invalid setting '${kv}'. Expected key=value.")
        }
        settings[parts[0].trim()] = parts[1]
    }
    return settings
}

def collectTestOpenSearchSettings = {
    def settings = new LinkedHashMap<String, String>()
    System.properties
        .findAll { entry -> entry.key.toString().startsWith('tests.opensearch.') }
        .sort { a, b -> a.key.toString() <=> b.key.toString() }
        .each { entry ->
            def key = entry.key.toString().substring('tests.opensearch.'.length())
            settings[key] = entry.value.toString()
        }
    return settings
}

// Where OpenSearch should take its JDK from (CRITICAL on macOS!)
def osJavaHome = (findProperty('osJavaHome')
        ?: System.getenv('OPENSEARCH_JAVA_HOME')
        ?: System.getenv('JAVA_HOME')
        ?: System.getProperty('java.home')).toString()
if (!new File(osJavaHome).exists()) {
    throw new GradleException("OPENSEARCH_JAVA_HOME not found. Set -PosJavaHome=<your JDK> or export JAVA_HOME/OPENSEARCH_JAVA_HOME.")
}

// Dependent plugins (install first). AD needs Job Scheduler.
def depPluginsCsv  = (findProperty('depPlugins') ?: 'opensearch-job-scheduler').toString()
// Optional: override plugin URLs, e.g. CI/BWC
def depPluginUrls  = (findProperty('depPluginUrls') ?: '').toString()
// Force reinstall deps too
def forceReinstallDeps = (findProperty('forceReinstallDeps') ?: 'false').toString().toBoolean()

// AD plugin version scheme: <osVersion>.<patch>[ -SNAPSHOT ]
def isSnapshot = osVersion.endsWith('-SNAPSHOT')
def baseVer    = isSnapshot ? osVersion.replace('-SNAPSHOT','') : osVersion
def patch      = (findProperty('pluginPatch') ?: '0').toString()
def pluginVer  = isSnapshot ? "${baseVer}.${patch}-SNAPSHOT" : "${baseVer}.${patch}"

// ====== Linux-min distro URLs only ======
def archiveExt = 'tar.gz'
def defaultReleaseUrl  = "https://artifacts.opensearch.org/releases/core/opensearch/${osVersion}/opensearch-min-${osVersion}-${osPlatform}.${archiveExt}"
def defaultSnapshotUrl = "https://artifacts.opensearch.org/snapshots/core/opensearch/${osVersion}/opensearch-min-${osVersion}-${osPlatform}-latest.${archiveExt}"

// Allow explicit override (URL or local file)
def osDistUrlProp  = (findProperty('osDistUrl')  ?: '').toString()
def osDistFileProp = (findProperty('osDistFile') ?: '').toString()

// ====== Layout ======
def cacheDir  = layout.buildDirectory.dir("run/cache").get().asFile
def tarDest   = new File(cacheDir, "opensearch-dist.${archiveExt}")
def osRootDir = layout.buildDirectory.dir("run/os").get().asFile

// --- Download Linux-min distro ---
tasks.register('prepareOpenSearchTar') {
    outputs.file(tarDest)
    doLast {
        cacheDir.mkdirs()
        if (osDistFileProp) {
            copy {
                from file(osDistFileProp)
                into cacheDir
                rename { "opensearch-dist.${archiveExt}" }
            }
        } else {
            def url = osDistUrlProp ?: (isSnapshot ? defaultSnapshotUrl : defaultReleaseUrl)
            println "Downloading OpenSearch (Linux-min) from: ${url}"
            ant.get(src: url, dest: tarDest, verbose: true, usetimestamp: true)
        }
    }
}

// --- Unpack and ensure scripts are executable ---
tasks.register('unpackOpenSearch', Copy) {
    dependsOn 'prepareOpenSearchTar'
    from { tarTree(resources.gzip(tarDest)) }
    into osRootDir
    doLast {
        def children = osRootDir.listFiles() ?: [] as File[]
        println "Unpacked into: ${osRootDir}"
        println "Contents: ${children.collect{it.name}}"
        // Make sure scripts are executable (macOS sometimes strips exec bits)
        def root = osRootDir.listFiles().find { it.isDirectory() && it.name.toLowerCase().startsWith("opensearch") }
        if (root) {
            ["bin/opensearch", "bin/opensearch-plugin"].each { rel ->
                def f = new File(root, rel)
                if (f.exists()) {
                    f.setExecutable(true, true)
                }
            }
        }
    }
}

// --- Helper: locate OpenSearch home (works for min / non-min) ---
def findOpenSearchHome = {
    if (!osRootDir.exists()) osRootDir.mkdirs()
    def cands = osRootDir.listFiles()?.findAll { it.isDirectory() && it.name.toLowerCase().startsWith("opensearch") } ?: []
    if (cands.isEmpty()) {
        throw new GradleException("No 'opensearch*' directory under ${osRootDir}. " +
            "Expected something like 'opensearch-3.x.y'.")
    }
    return cands.sort { -it.lastModified() }[0]
}

// Try explicit override → Gradle resolution (uses repositories order) → Maven coords → Maven Central URL → artifacts site → (optional) CI

def pluginUrlFor = { String pluginName ->
    // 1) explicit per-plugin override: -PdepPluginUrls="name=url,name2=url2"
    if (depPluginUrls) {
        def map = depPluginUrls.split(/\s*,\s*/).findResults {
            def m = it.split(/\s*=\s*/, 2)
            (m.size() == 2) ? [(m[0]): m[1]] : null
        }.inject([:]) { acc, m -> acc << m }
        if (map[pluginName]) return [ map[pluginName] ]
    }

    def baseVerShort = baseVer.split('\\.')[0..1].join('.') // e.g., 3.2
    def candidates = []

    // 2) Resolve via Gradle first (respects repositories order: mavenLocal() → CI snapshots → mavenCentral() → ...)
    try {
        def dep = dependencies.create("org.opensearch.plugin:${pluginName}:${pluginVer}@zip")
        def cfg = configurations.detachedConfiguration(dep)
        cfg.transitive = false
        def artifact = cfg.resolvedConfiguration.resolvedArtifacts.find { it.name.startsWith(pluginName) }
        if (artifact?.file?.exists()) {
            candidates << "file:${artifact.file.absolutePath}"
        }
    } catch (Exception ignored) {
        // Fall back to other candidates below
    }

    // 3) Maven coordinates (opensearch-plugin can fetch from Maven Central)
    candidates << "org.opensearch.plugin:${pluginName}:${pluginVer}"

    // 4) Direct Maven Central URL (repo1)
    candidates << "https://repo1.maven.org/maven2/org/opensearch/plugin/${pluginName}/${pluginVer}/${pluginName}-${pluginVer}.zip"

    // 5) Official artifacts site (releases or snapshots)
    if (isSnapshot) {
        candidates << "https://artifacts.opensearch.org/snapshots/plugins/${pluginName}/${osVersion}/${pluginName}-${pluginVer}.zip"
    } else {
        candidates << "https://artifacts.opensearch.org/releases/plugins/${pluginName}/${baseVer}/${pluginName}-${pluginVer}.zip"
    }

    // 6) CI mirror
    // e.g., https://ci.opensearch.org/ci/dbc/distribution-build-opensearch/3.4.0/latest/linux/x64/tar/builds/opensearch/plugins/opensearch-job-scheduler-3.4.0.0.zip
    candidates << "https://ci.opensearch.org/ci/dbc/distribution-build-opensearch/${baseVer}/latest/linux/x64/tar/builds/opensearch/plugins/${pluginName}-${pluginVer}.zip"

    return candidates
}

// --- Install dependency plugins (Job Scheduler first) ---
tasks.register('installDepPlugins') {
    dependsOn 'unpackOpenSearch'
    mustRunAfter 'clean'
    doLast {
        def root = findOpenSearchHome()
        def depNames = depPluginsCsv.split(/\s*,\s*/).findAll { it }

        depNames.each { pluginName ->
            if (forceReinstallDeps) {
                exec {
                    workingDir root
                    ignoreExitValue = true
                    environment "OPENSEARCH_JAVA_HOME", osJavaHome
                    commandLine "./bin/opensearch-plugin", "remove", pluginName
                }
            } else if (new File(root, "plugins/${pluginName}").exists()) {
                println "Dependency plugin already present: ${pluginName} — skipping."
                return
            }

            def installed = false
            def tried = []
            pluginUrlFor(pluginName).each { ref ->
                if (installed) return
                tried << ref
                def res = exec {
                    workingDir root
                    ignoreExitValue = true
                    environment "OPENSEARCH_JAVA_HOME", osJavaHome
                    commandLine "./bin/opensearch-plugin", "install", "--batch", ref
                }
                if (res.exitValue == 0) {
                    println "Installed dependency plugin: ${pluginName} via ${ref}"
                    installed = true
                } else {
                    println "Install attempt failed for ${pluginName} via ${ref} (trying next)"
                }
            }
            if (!installed) throw new GradleException("Failed to install dependency plugin ${pluginName}. Tried: ${tried}")
        }
    }
}

// --- Always reinstall AD (remove if exists, then install fresh ZIP) ---
tasks.register('installPlugin') {
    dependsOn 'bundlePlugin', 'installDepPlugins'
    mustRunAfter 'clean'
    doLast {
        def root = findOpenSearchHome()
        // remove if present
        exec {
            workingDir root
            ignoreExitValue = true
            environment "OPENSEARCH_JAVA_HOME", osJavaHome
            commandLine "./bin/opensearch-plugin", "remove", "opensearch-anomaly-detection"
        }
        File pluginZip = tasks.named('bundlePlugin').get().archiveFile.get().asFile
        if (!pluginZip.exists()) throw new GradleException("Plugin zip not found: ${pluginZip}")
        exec {
            workingDir root
            environment "OPENSEARCH_JAVA_HOME", osJavaHome
            commandLine "./bin/opensearch-plugin", "install", "--batch", "file:${pluginZip.absolutePath}"
        }
        println "Installed AD plugin from ${pluginZip.name}"
    }
}

// --- Run OpenSearch single-node on explicit ports (Linux/macOS) ---
tasks.register('runAtPorts', Exec) {
    group = "opensearch"
    description = "Run OpenSearch (Linux-min) single-node with this plugin on custom HTTP/transport ports (Linux/macOS)"
    dependsOn 'bundlePlugin', 'installPlugin'
    mustRunAfter 'clean'
    doFirst {
        def root = findOpenSearchHome()
        workingDir root
        def forwardedTestSettings = collectTestOpenSearchSettings()
        def mergedSettings = new LinkedHashMap<String, String>(forwardedTestSettings)
        mergedSettings.putAll(parseRunAtPortsSettings(extraSettings))
        def cmd = ["./bin/opensearch",
            "-E", "discovery.type=single-node",
            "-E", "http.port=${httpPort}",
            "-E", "transport.port=${transportPort}"]
        if (!mergedSettings.isEmpty()) {
            mergedSettings.each { key, value -> cmd += ["-E", "${key}=${value}"] }
        }
        commandLine cmd
        // Force use of host JDK (mac must not try to use the Linux JDK inside the tarball)
        environment "OPENSEARCH_JAVA_HOME", osJavaHome
        if (osJavaOpts) environment "OPENSEARCH_JAVA_OPTS", osJavaOpts

        println "OpenSearch home       : ${root}"
        println "HTTP / Transport ports: ${httpPort} / ${transportPort}"
        println "OPENSEARCH_JAVA_HOME  : ${osJavaHome}"
        if (!forwardedTestSettings.isEmpty()) {
            println "Forwarded -Dtests.*   : ${forwardedTestSettings.collect { key, value -> "${key}=${value}" }.join(', ')}"
        }
        if (extraSettings) println "Extra -E              : ${extraSettings}"
        if (osJavaOpts)   println "OPENSEARCH_JAVA_OPTS  : ${osJavaOpts}"
        println "Starting OpenSearch (single-node)... (Ctrl+C to stop)"
    }
}

// Create gradle cache by resolving all the project dependencies, used by brazil-gradle
 
void resolveConfiguration(configuration) {
  if (configuration.canBeResolved && isResolveableConfiguration(configuration)) {
      configuration.resolve()
  }
}
 
boolean isResolveableConfiguration(configuration) {
    def nonResolveableConfigurations = ['loggerUsagePlugin']
    def dependency_list = configuration.allDependencies
    for(dep in dependency_list){
        if("${dep.group}:${dep.name}" == "org.opensearch.distribution.integ-test-zip:opensearch"){
            println("Skipping configuration: ${configuration.getName()} because it contains dependency ${dep.group}:${dep.name}:${dep.version}")
            return false
        }
    }
    if (nonResolveableConfigurations.contains(configuration.getName())) {
        return false
    }
    return true
}
 
allprojects {
    tasks.register('resolveAllDependencies') {
        doLast {
            project.rootProject.allprojects.each { subProject ->
                subProject.configurations.each { configuration ->
                    resolveConfiguration(configuration)
                }
            }
        }
    }
}
