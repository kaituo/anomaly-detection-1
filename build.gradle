    filter {
        includeTestsMatching "org.opensearch.ad.rest.MultiTenant*IT"
        includeTestsMatching "org.opensearch.ad.e2e.MultiTenant*IT"
        excludeTestsMatching "org.opensearch.ad.rest.MultiTenantThreeRole*IT"
