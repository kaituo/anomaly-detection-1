name: "Gradle Run and Assemble"
on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  gradle-run-assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Run gradle :run
        run: ./gradlew :run
      - name: Run gradle assemble
        run: ./gradlew assemble